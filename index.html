<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>塔羅學中文 抽牌</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+TC:wght@500;700&family=Noto+Serif+JP:wght@500&display=swap">
<style>
/* Layout: one centered ritual column — question → fan of face-down cards → spread slots → reading → history */
:root{
  --bg:#fbefe9; --surface:#fff8f4; --ink:#5a3a31; --muted:#8c6a5f; --gold:#a8783a; --gold-soft:#e6cc92;
  --rose:#c4705f; --on-rose:#fffaf6; --chip:#f6dfd7; --mist:#dbe8f0; --line:rgba(168,120,58,.32);
  --glow1:rgba(255,255,255,.85); --glow2:rgba(205,224,236,.75); --shadow:rgba(120,70,55,.18);
  --font-zh:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --font-en:"Cormorant Garamond","Times New Roman",serif;
  --font-ja:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  --font-ui:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#22171d; --surface:#2e2028; --ink:#f4e4dc; --muted:#c4a79c; --gold:#e2bf7c; --gold-soft:#8a6a3a;
  --rose:#e39b8b; --on-rose:#2a1a20; --chip:#3d2a31; --mist:#2b3944; --line:rgba(226,191,124,.28);
  --glow1:rgba(227,155,139,.13); --glow2:rgba(120,155,185,.12); --shadow:rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#22171d; --surface:#2e2028; --ink:#f4e4dc; --muted:#c4a79c; --gold:#e2bf7c; --gold-soft:#8a6a3a;
  --rose:#e39b8b; --on-rose:#2a1a20; --chip:#3d2a31; --mist:#2b3944; --line:rgba(226,191,124,.28);
  --glow1:rgba(227,155,139,.13); --glow2:rgba(120,155,185,.12); --shadow:rgba(0,0,0,.45); color-scheme:dark}

@property --h{syntax:'<angle>';inherits:true;initial-value:0deg}
*{box-sizing:border-box}
body{background:var(--bg);background-image:radial-gradient(70% 45% at 10% 0%,var(--glow1),transparent 70%),radial-gradient(55% 40% at 100% 18%,var(--glow2),transparent 70%);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.65;min-height:100%}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 72px;display:grid;gap:28px}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rose);outline-offset:3px}

/* header */
.top{text-align:center;display:grid;justify-items:center;gap:6px;padding-top:8px}
.moon{width:46px;height:46px}
.eyebrow{margin:0;font-family:var(--font-en);font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
h1{margin:0;font-family:var(--font-zh);font-weight:700;font-size:clamp(28px,6vw,40px);letter-spacing:.08em;text-wrap:balance;line-height:1.3}
.sub{margin:0;max-width:34em;color:var(--muted);text-wrap:balance}

/* setup */
.setup{display:grid;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 10px 30px -18px var(--shadow)}
.label{font-size:12px;letter-spacing:.12em;color:var(--muted);margin:0 0 8px}
.spreads{display:flex;flex-wrap:wrap;gap:8px}
.spreads input{position:absolute;opacity:0;pointer-events:none}
.spreads label{cursor:pointer;border:1px solid var(--line);border-radius:999px;padding:6px 12px;display:flex;align-items:baseline;gap:6px;line-height:1.25;background:transparent;transition:background .2s,border-color .2s}
.spreads label b{font-family:var(--font-zh);font-weight:500;font-size:15px}
.spreads label .cnt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.spread-groups{display:grid;gap:14px}
.sg{display:grid;gap:7px}
.sg-title{margin:0;font-family:var(--font-zh);font-size:13px;letter-spacing:.14em;color:var(--gold)}
.sg-title span{font-family:var(--font-en);font-style:italic;letter-spacing:.02em;color:var(--muted);margin-left:6px;font-size:14px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted);counter-reset:st}
.steps li{counter-increment:st;display:flex;gap:6px;align-items:baseline}
.steps li::before{content:counter(st);font-family:var(--font-en);font-weight:600;font-size:15px;color:var(--rose)}
.sp-info{border:1px dashed var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:8px}
.sp-info h3{margin:0;font-family:var(--font-zh);font-weight:700;font-size:18px;letter-spacing:.08em;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.sp-info h3 small{font-family:var(--font-en);font-style:italic;font-weight:500;font-size:16px;color:var(--muted);letter-spacing:0}
.sp-info h3 .ja{font-size:14px;color:var(--rose);font-weight:500;letter-spacing:.04em}
.pos-list{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.pos-list li{font-size:13px;background:var(--chip);border-radius:8px;padding:2px 9px}
.pos-list li b{font-family:var(--font-en);color:var(--rose);margin-right:5px;font-variant-numeric:tabular-nums}
.switches{display:grid;gap:10px}
.switch small{font-size:12px;color:var(--muted)}
.spreads input:checked+label{background:var(--chip);border-color:var(--gold)}
.spreads input:focus-visible+label{outline:2px solid var(--rose);outline-offset:2px}
textarea{width:100%;min-height:62px;resize:vertical;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:10px 12px;font-size:15px}
textarea::placeholder{color:var(--muted);opacity:.8}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px}
.switch input{width:40px;height:22px;appearance:none;border-radius:999px;background:var(--chip);border:1px solid var(--line);position:relative;cursor:pointer;transition:background .2s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--gold);transition:transform .2s}
.switch input:checked{background:var(--rose)}
.switch input:checked::after{transform:translateX(18px);background:var(--on-rose)}
.btn{border:0;border-radius:999px;padding:10px 20px;font-family:var(--font-zh);font-weight:500;letter-spacing:.12em;cursor:pointer;background:var(--rose);color:var(--on-rose);box-shadow:0 6px 16px -8px var(--shadow);transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}

/* table */
.table{display:grid;gap:18px;justify-items:center}
.hint{margin:0;font-family:var(--font-zh);letter-spacing:.1em;color:var(--muted);text-align:center;min-height:1.6em}
.hint em{font-family:var(--font-en);font-style:italic;letter-spacing:0;font-size:15px}
.fan{position:relative;width:100%;max-width:760px;transition:height .3s}
.fc{position:absolute;left:50%;top:26px;width:var(--cw);height:var(--ch);padding:2px;border:0;border-radius:8%/4.8%;cursor:pointer;
  background:conic-gradient(from 200deg,#f7c6d9,#c9e7f7,#d6f5d1,#fbedb5,#f5c3c0,#dccbf5,#f7c6d9);
  transform-origin:50% var(--R);transform:translateX(-50%) rotate(var(--a)) translateY(var(--lift,0px));
  transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .3s;box-shadow:0 4px 10px -4px var(--shadow)}
.fc svg{width:100%;height:100%;display:block;border-radius:7%/4.2%}
.fc:hover,.fc:focus-visible{--lift:-16px}
.fc.taken{opacity:0;pointer-events:none}
.fan.done .fc:not(.taken){opacity:.45;pointer-events:none}
.fan.gather .fc{transform:translateX(-50%) rotate(calc(var(--j)*1deg)) translateY(46px)}
.ghost-card{position:fixed;z-index:60;pointer-events:none;padding:2px;border-radius:8%/4.8%;background:conic-gradient(from 200deg,#f7c6d9,#c9e7f7,#d6f5d1,#fbedb5,#f5c3c0,#dccbf5,#f7c6d9)}
.ghost-card svg{width:100%;height:100%;display:block;border-radius:7%/4.2%}

.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:16px 12px;width:100%}
.slot{display:grid;gap:8px;justify-items:center;align-content:start;min-width:0;width:var(--sw);max-width:calc((100% - 24px)/3)}
.slots.compact .slot{max-width:calc((100% - 36px)/4)}
.slots.compact .slot-label{font-size:12px;letter-spacing:.04em}
.slots.compact .slot-label small:not(.ja){display:none}
.slots.compact .slot-label .ja{font-size:11px}
.slots.compact .frame{font-size:18px}
.slot-label .num{font-family:var(--font-en);color:var(--rose);margin-right:3px}
.slot-label{font-family:var(--font-zh);font-size:14px;letter-spacing:.12em;text-align:center;line-height:1.3}
.slot-label small{display:block;font-family:var(--font-en);font-style:italic;letter-spacing:0;color:var(--muted);font-size:13px}
.frame{width:100%;aspect-ratio:3/5;max-width:100%;border-radius:8%/4.8%;border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-family:var(--font-en);font-size:28px}
.frame.filled{border:0}
.flip{width:100%;height:100%;perspective:1000px;cursor:pointer;border:0;padding:0;background:none}
.flip-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,.7,.2,1)}
.flip.on .flip-inner{transform:rotateY(180deg)}
.side{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:2.5px;border-radius:8%/4.8%;
  background:conic-gradient(from var(--h),#f7c6d9,#c9e7f7,#d6f5d1,#fbedb5,#f5c3c0,#dccbf5,#f7c6d9);animation:foil 9s linear infinite;box-shadow:0 12px 26px -12px var(--shadow)}
.side svg{width:100%;height:100%;display:block;border-radius:7%/4.2%}
.side.front{transform:rotateY(180deg)}
.face{width:100%;height:100%;position:relative;border-radius:7%/4.2%;overflow:hidden}
.face.rev{transform:rotate(180deg)}
.face::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 28%,rgba(255,140,190,.22) 40%,rgba(140,220,255,.24) 48%,rgba(255,236,140,.22) 56%,rgba(200,170,255,.18) 62%,transparent 72%);background-size:260% 260%;background-position:var(--mx,30%) var(--my,30%);mix-blend-mode:multiply;transition:background-position .2s}
@keyframes foil{to{--h:360deg}}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* reading */
.reading{display:grid;gap:22px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px 18px;box-shadow:0 18px 40px -26px var(--shadow)}
.r-head{text-align:center;display:grid;gap:4px}
.r-head h2{margin:0;font-family:var(--font-zh);font-weight:700;font-size:clamp(20px,4.5vw,26px);letter-spacing:.06em;text-wrap:balance}
.r-head time{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.yn{display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 0}
.yn-ans{font-family:var(--font-zh);font-weight:700;font-size:54px;line-height:1;color:var(--rose)}
.yn-txt{display:grid;line-height:1.35}
.yn-txt b{font-family:var(--font-zh);font-weight:500;font-size:17px}
.yn-txt small{color:var(--muted);font-family:var(--font-en);font-style:italic;font-size:15px}
.r-card{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:22px;align-items:center;border-top:1px solid var(--line);padding-top:22px}
.r-card:first-of-type{border-top:0;padding-top:0}
.tilt{perspective:900px;width:100%;max-width:220px;justify-self:center}
.tilt-in{position:relative;aspect-ratio:3/5;transition:transform .25s ease-out;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.tilt-in .side{animation-duration:6s}
.r-text{min-width:0;display:grid;gap:8px}
.pos{margin:0;font-size:12px;letter-spacing:.16em;color:var(--gold);text-transform:uppercase}
.r-text h3{margin:0;font-family:var(--font-zh);font-weight:700;font-size:28px;letter-spacing:.1em;line-height:1.25;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.py{font-family:var(--font-en);font-style:italic;font-weight:500;font-size:19px;letter-spacing:.02em;color:var(--rose)}
.en{margin:0;font-family:var(--font-en);font-size:18px;color:var(--muted)}
.pill{justify-self:start;font-size:12px;letter-spacing:.1em;border-radius:999px;padding:3px 10px;background:var(--mist);color:var(--ink)}
.pill.rev{background:var(--chip);color:var(--rose)}
.kw{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.kw li{border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-family:var(--font-zh);display:grid;line-height:1.3}
.kw small{font-family:var(--font-en);font-style:italic;color:var(--muted);font-size:13px}
.meaning{margin:0;font-size:16px;max-width:34em}
[lang="ja"]{font-family:var(--font-ja)}
.ja-name{margin:0;font-size:16px;display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}
.ja-name .tag,.meaning-ja .tag{font-family:var(--font-ui);font-size:11px;letter-spacing:.1em;color:var(--gold);border:1px solid var(--line);border-radius:6px;padding:0 6px}
.ja-name .kana{color:var(--muted);font-size:14px}
.kw .ja{font-size:13px;color:var(--rose);font-style:normal}
.meaning-ja{margin:0;font-size:15px;max-width:34em;color:var(--muted);display:flex;gap:8px;align-items:baseline}
.meaning-ja .tag{flex:none}
.spreads label .ja,.slot-label .ja{font-size:12px;color:var(--muted);font-style:normal;letter-spacing:.04em}
.yn-txt .ja{font-size:15px;color:var(--rose)}
@media (max-width:560px){.ja-name{justify-content:center}.meaning-ja{justify-content:center;text-align:left}}
.r-foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.note{margin:0;font-size:12px;color:var(--muted);text-align:center}
#copyFallback{width:100%;min-height:120px;font-size:13px}

/* history */
.history{display:grid;gap:10px}
.history h2{margin:0;font-family:var(--font-zh);font-weight:500;font-size:16px;letter-spacing:.14em}
.history ol{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.history li{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:14px;border-bottom:1px dashed var(--line);padding-bottom:8px}
.history time{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.history .q{color:var(--muted)}
.empty{color:var(--muted);font-size:14px;margin:0}

/* svg text on cards */
.t-zh{font-family:var(--font-zh);font-weight:500}
.t-en{font-family:var(--font-en);font-weight:600}

@media (max-width:560px){
  .r-card{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center}
  .r-text{justify-items:center}
  .r-text h3{justify-content:center}
  .pill{justify-self:center}
  .kw{justify-content:center}
  .tilt{max-width:200px}
}
@media (prefers-reduced-motion:reduce){
  .side{animation:none}
  .fc,.flip-inner,.tilt-in{transition:none}
}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="300" y2="500">
      <stop offset="0" stop-color="#a46f2a"/><stop offset=".28" stop-color="#e6c784"/><stop offset=".5" stop-color="#b4843f"/><stop offset=".72" stop-color="#f0d89e"/><stop offset="1" stop-color="#9c6a28"/>
    </linearGradient>
    <linearGradient id="gm" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="100">
      <stop offset="0" stop-color="#a46f2a"/><stop offset=".3" stop-color="#e2c27c"/><stop offset=".52" stop-color="#ad7d38"/><stop offset=".75" stop-color="#ecd294"/><stop offset="1" stop-color="#9c6a28"/>
    </linearGradient>
    <linearGradient id="iv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf8f1"/><stop offset="1" stop-color="#f5e9de"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#f2c9bd" stop-opacity=".95"/><stop offset=".62" stop-color="#f6d9cf" stop-opacity=".55"/><stop offset="1" stop-color="#f6d9cf" stop-opacity="0"/></radialGradient>
    <radialGradient id="mist" cx=".4" cy=".35"><stop offset="0" stop-color="#eef5fa"/><stop offset="1" stop-color="#c6dae8"/></radialGradient>
    <linearGradient id="bk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9b4a7"/><stop offset=".5" stop-color="#f5d8ce"/><stop offset="1" stop-color="#e0a191"/></linearGradient>
    <radialGradient id="bglow"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  </defs>
  <symbol id="back" viewBox="0 0 300 500"></symbol>
</svg>

<main class="wrap">
  <header class="top">
    <svg class="moon" viewBox="0 0 100 100" aria-hidden="true"><g fill="none" stroke="url(#gm)" stroke-width="2" stroke-linecap="round"><path d="M62 18A32 32 0 1 0 62 78A34 34 0 0 1 62 18Z" fill="url(#gm)" fill-opacity=".25"/></g><path d="M80 26Q80 34 88 34Q80 34 80 42Q80 34 72 34Q80 34 80 26Z" fill="url(#gm)"/></svg>
    <p class="eyebrow">塔羅學中文 · Tarot &amp; Chinese · <span lang="ja">日本語</span></p>
    <h1>今天想問什麼？</h1>
    <p class="sub">選一種牌陣，寫下問題，憑直覺抽牌。每張牌都附中文、拼音、英文和日文。</p>
  </header>

  <section class="setup" aria-label="抽牌設定">
    <ol class="steps"><li>選牌陣</li><li>默想問題，按「洗牌」</li><li>點一個位置切牌</li><li>依牌位抽牌、翻牌</li></ol>
    <div>
      <p class="label">牌陣 SPREAD · <span lang="ja">スプレッド</span></p>
      <div class="spread-groups" id="spreadGroups" role="radiogroup" aria-label="牌陣"></div>
    </div>
    <div class="sp-info" id="spInfo" aria-live="polite"></div>
    <div>
      <label class="label" for="q">你的問題 QUESTION（可不填）</label>
      <textarea id="q" maxlength="120" placeholder="例如：這個月適合開始新計畫嗎？"></textarea>
    </div>
    <div>
      <p class="label">牌組設定 DECK · <span lang="ja">デッキ設定</span></p>
      <div class="switches">
        <label class="switch" for="revToggle"><input type="checkbox" id="revToggle" checked> 包含逆位 <small>Reversed · <span lang="ja">逆位置あり</span></small></label>
        <label class="switch" for="majorToggle"><input type="checkbox" id="majorToggle"> 只用 22 張大牌 <small>Major Arcana only · <span lang="ja">大アルカナのみ</span></small></label>
        <label class="switch" for="cutToggle"><input type="checkbox" id="cutToggle" checked> 抽牌前先切牌 <small>Cut the deck · <span lang="ja">カットする</span></small></label>
      </div>
    </div>
    <div class="row" style="justify-content:center">
      <button class="btn" id="shuffleBtn" type="button">洗牌</button>
    </div>
  </section>

  <section class="table" aria-label="牌桌">
    <p class="hint" id="hint"></p>
    <div class="fan" id="fan"></div>
    <div class="slots" id="slots"></div>
    <div class="actions">
      <button class="btn" id="revealAll" type="button" hidden>翻開全部</button>
      <button class="btn ghost" id="resetBtn" type="button" hidden>重新抽牌</button>
    </div>
  </section>

  <section class="reading" id="reading" hidden aria-live="polite"></section>

  <section class="history" aria-label="最近抽牌">
    <h2>最近抽牌</h2>
    <div id="hist"></div>
  </section>
</main>

<script>
(()=>{
const fx=v=>+(+v).toFixed(1);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rand(){try{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296}catch(e){return Math.random()}}

const $=s=>document.querySelector(s);
const fan=$('#fan'),slots=$('#slots'),hint=$('#hint'),reading=$('#reading'),revealBtn=$('#revealAll'),resetBtn=$('#resetBtn');
let deck=[],picks=[],spreadKey='daily',busy=false,phase='pick';

function renderSpreadPicker(){

function renderSpreadInfo(){

}

function shuffleDeck(){
  deck=DECK.filter(c=>!$('#majorToggle').checked||c.major).map(c=>c.id);
  for(let i=deck.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}
}
function setHint(html){hint.innerHTML=html}

function renderFan(){
  fan.innerHTML='';fan.classList.remove('done');
  for(let i=0;i<FAN_N;i++){
    const b=document.createElement('button');b.type='button';b.className='fc';b.dataset.i=i;
    b.setAttribute('aria-label',`第 ${i+1} 張牌`);b.innerHTML=backSVG;
    b.style.setProperty('--j',fx((rand()-.5)*14));b.style.zIndex=i;
    b.addEventListener('click',()=>pick(b));fan.appendChild(b);
  }
  layoutFan();
}
function layoutFan(){
  const Wd=fan.clientWidth||340;const cw=Math.round(Math.max(54,Math.min(84,Wd*.15))),ch=Math.round(cw*5/3);
  const reach=Math.max(40,Wd/2-cw/2-6);let half=50*Math.PI/180;let R=reach/Math.sin(half);
  if(R>420){R=420;half=Math.min(half,Math.asin(Math.min(1,reach/R)))}
  fan.style.setProperty('--cw',cw+'px');fan.style.setProperty('--ch',ch+'px');fan.style.setProperty('--R',fx(R)+'px');
  fan.style.height=Math.round(ch+R*(1-Math.cos(half))+40)+'px';
  [...fan.children].forEach((el,i)=>el.style.setProperty('--a',fx(-half+2*half*i/(FAN_N-1))+'rad'));
}
function renderSlots(){
  const sp=SPREADS[spreadKey];
  slots.style.setProperty('--sw',sp.n===1?'200px':sp.n<=3?'170px':sp.n<=6?'118px':'96px');
  slots.classList.toggle('compact',sp.n>4);
  slots.innerHTML=sp.labels.map((l,i)=>`<div class="slot"><div class="slot-label">${sp.n>1?`<span class="num">${i+1}</span>`:''}${l[0]}<small>${l[1]}</small><small class="ja" lang="ja">${l[2]}</small></div><div class="frame" data-s="${i}">${i+1}</div></div>`).join('');
}
function updateHint(){
  const sp=SPREADS[spreadKey];const left=sp.n-picks.length;
  fan.classList.toggle('cutting',phase==='cut');
  if(phase==='cut')setHint('先切牌：憑感覺點牌堆的一個位置 <em>— tap anywhere to cut</em>');
  else if(left>0)setHint(`靜下心想著你的問題，憑直覺選 <b>${left}</b> 張 <em>— pick ${left} ${left>1?'cards':'card'}</em>`);
  else if(picks.some(p=>!p.open))setHint('點一下牌面翻開 <em>— tap to reveal</em>');
  else setHint('牌已翻開，往下看解讀 <em>— your reading is below</em>');
  revealBtn.hidden=!(left===0&&picks.some(p=>!p.open));
  resetBtn.hidden=picks.length===0;
}

function fly(fromEl,toEl,angle){
  return new Promise(res=>{
    if(reduce||!fromEl.animate){res();return}
    const a=fromEl.getBoundingClientRect(),b=toEl.getBoundingClientRect();
    const g=document.createElement('div');g.className='ghost-card';g.innerHTML=backSVG;
    Object.assign(g.style,{left:b.left+'px',top:b.top+'px',width:b.width+'px',height:b.height+'px'});
    document.body.appendChild(g);
    const s=fromEl.offsetWidth/b.width;
    const anim=g.animate([{transform:`translate(${a.left+a.width/2-(b.left+b.width/2)}px,${a.top+a.height/2-(b.top+b.height/2)}px) rotate(${angle}) scale(${s})`},{transform:'none'}],{duration:640,easing:'cubic-bezier(.2,.8,.2,1)'});
    anim.onfinish=()=>{g.remove();res()};
  });
}

function cutAt(el){
  const k=Math.max(1,Math.floor((+el.dataset.i+.5)/FAN_N*deck.length));
  deck=deck.slice(k).concat(deck.slice(0,k));
  phase='pick';
  if(reduce){updateHint();return}
  busy=true;fan.classList.add('gather');setHint('切牌中… <em>— cutting</em>');
  setTimeout(()=>{fan.classList.remove('gather');busy=false;updateHint()},600);
}
async function pick(el){
  const sp=SPREADS[spreadKey];
  if(phase==='cut'&&!busy){cutAt(el);return}
  if(busy||picks.length>=sp.n||el.classList.contains('taken'))return;
  busy=true;
  const slotIdx=picks.length;
  const id=deck[+el.dataset.i];
  const rev=$('#revToggle').checked&&rand()<.5;
  const p={id,rev,open:false};picks.push(p);
  const frame=slots.querySelector(`[data-s="${slotIdx}"]`);
  const angle=el.style.getPropertyValue('--a');
  el.classList.add('taken');
  frame.classList.add('filled');
  frame.innerHTML=`<button type="button" class="flip" aria-label="翻開第 ${slotIdx+1} 張牌" style="visibility:hidden"><div class="flip-inner"><div class="side back">${backSVG}</div><div class="side front"><div class="face${rev?' rev':''}">${cardFace(DECK[id])}</div></div></div></button>`;
  const flip=frame.querySelector('.flip');
  await fly(el,flip,angle);
  flip.style.visibility='';
  flip.addEventListener('click',()=>openCard(slotIdx));
  if(picks.length===sp.n)fan.classList.add('done');
  busy=false;updateHint();
}
function openCard(i){
  const p=picks[i];if(!p||p.open)return;p.open=true;
  slots.querySelector(`[data-s="${i}"] .flip`).classList.add('on');
  updateHint();
  if(picks.length===SPREADS[spreadKey].n&&picks.every(x=>x.open))setTimeout(showReading,reduce?0:950);
}
revealBtn.addEventListener('click',()=>{picks.forEach((p,i)=>{if(!p.open)setTimeout(()=>openCard(i),reduce?0:i*260)})});

function showReading(){
  const sp=SPREADS[spreadKey];const q=$('#q').value.trim();const now=new Date();

  let html=`<div class="r-head"><p class="eyebrow">${esc(sp.title)}</p><h2>${q?esc(q):'今天的牌想對你說'}</h2><time>${dateStr}</time></div>`;
  if(spreadKey==='yn'){const y=YN_TXT[ynOf(picks[0])];html+=`<div class="yn"><span class="yn-ans">${y[0]}</span><span class="yn-txt"><b>${y[1]}</b><small>${y[2]}</small><span class="ja" lang="ja">${y[3]}</span></span></div>`}
  picks.forEach((p,i)=>{const c=DECK[p.id];
    html+=`<article class="r-card"><div class="tilt"><div class="tilt-in"><div class="side" style="transform:none"><div class="face${p.rev?' rev':''}">${cardFace(c)}</div></div></div></div>
    <div class="r-text"><p class="pos">${sp.labels[i][0]} · ${sp.labels[i][1]} · <span lang="ja">${sp.labels[i][2]}</span></p>
    <h3>${esc(c.zh)}<span class="py">${esc(c.py)}</span></h3><p class="en">${esc(c.en)}</p>
    <p class="ja-name"><span class="tag">日本語</span><span lang="ja">${esc(c.ja.name)}</span>${c.ja.kana?`<span class="kana" lang="ja">${esc(c.ja.kana)}</span>`:''}</p>
    <span class="pill${p.rev?' rev':''}">${p.rev?'逆位 Reversed · <span lang="ja">逆位置</span>':'正位 Upright · <span lang="ja">正位置</span>'}</span>
    <ul class="kw">${c.kw.map((k,j)=>`<li>${esc(k)}<small>${esc(c.kwen[j])}</small><small class="ja" lang="ja">${esc(c.ja.kw[j])}</small></li>`).join('')}</ul>
    <p class="meaning">${esc(p.rev?c.rev:c.up)}</p>
    <p class="meaning-ja"><span class="tag">日</span><span lang="ja">${esc(p.rev?c.ja.rev:c.ja.up)}</span></p></div></article>`});
  html+=`<div class="r-foot"><button class="btn" type="button" id="copyBtn">複製結果</button><button class="btn ghost" type="button" id="againBtn">再抽一次</button></div>
  <textarea id="copyFallback" readonly hidden></textarea>
  <p class="note">牌義僅供自我覺察與娛樂參考，重要決定請以實際情況為準。</p>`;
  reading.innerHTML=html;reading.hidden=false;
  reading.querySelectorAll('.tilt').forEach(t=>{const inn=t.querySelector('.tilt-in'),face=t.querySelector('.face');
    t.addEventListener('pointermove',e=>{if(reduce)return;const r=t.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
      inn.style.setProperty('--ry',fx((x-.5)*16)+'deg');inn.style.setProperty('--rx',fx((.5-y)*16)+'deg');
      face.style.setProperty('--mx',fx(x*100)+'%');face.style.setProperty('--my',fx(y*100)+'%')});
    t.addEventListener('pointerleave',()=>{inn.style.setProperty('--ry','0deg');inn.style.setProperty('--rx','0deg')})});
  $('#copyBtn').addEventListener('click',copyResult);
  $('#againBtn').addEventListener('click',()=>{resetAll(true);document.querySelector('.table').scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'})});
  saveHistory(q);
  setTimeout(()=>reading.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'}),reduce?0:250);
}
function resultText(){
  const sp=SPREADS[spreadKey],q=$('#q').value.trim();
  let t=`【塔羅學中文｜${sp.title}】\n`+(q?`問題：${q}\n`:'');
  if(spreadKey==='yn'){const y=YN_TXT[ynOf(picks[0])];t+=`答案：${y[0]}（${y[1]}）／${y[3]}\n`}
  picks.forEach((p,i)=>{const c=DECK[p.id];t+=`\n${sp.labels[i][0]}｜${c.zh}（${c.py}）${c.en}｜${c.ja.name}${c.ja.kana?'（'+c.ja.kana+'）':''}｜${p.rev?'逆位／逆位置':'正位／正位置'}\n關鍵字：${c.kw.join('、')}／${c.ja.kw.join('・')}\n${p.rev?c.rev:c.up}\n${p.rev?c.ja.rev:c.ja.up}\n`});
  return t;
}
function copyResult(){
  const btn=$('#copyBtn'),txt=resultText(),fb=$('#copyFallback');
  const fail=()=>{fb.value=txt;fb.hidden=false;fb.focus();fb.select();btn.textContent='請手動複製下方文字'};
  try{navigator.clipboard.writeText(txt).then(()=>{btn.textContent='已複製';setTimeout(()=>btn.textContent='複製結果',1800)},fail)}catch(e){fail()}
}

/* ---------- History ---------- */
const HKEY='tarot-xuezhongwen-history';
function loadHist(){try{return JSON.parse(localStorage.getItem(HKEY)||'[]')}catch(e){return[]}}
function saveHistory(q){
  const h=loadHist();h.unshift({t:Date.now(),s:spreadKey,q,c:picks.map(p=>[p.id,p.rev?1:0])});
  try{localStorage.setItem(HKEY,JSON.stringify(h.slice(0,8)))}catch(e){}
  renderHist(h.slice(0,8));
}
function renderHist(h=loadHist()){
  const el=$('#hist');
  if(!h.length){el.innerHTML='<p class="empty">還沒有紀錄。抽完牌後會自動存在這台裝置上（最多 8 筆）。</p>';return}
  el.innerHTML='<ol>'+h.map(r=>{const d=new Date(r.t);const sp=SPREADS[r.s]||SPREADS.daily;
    return `<li><time>${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}</time><span>${sp.title}：${r.c.map(([id,rv])=>esc(DECK[id].zh)+(rv?'（逆）':'')).join('、')}</span>${r.q?`<span class="q">「${esc(r.q)}」</span>`:''}</li>`}).join('')+'</ol>';
}

/* ---------- Controls ---------- */
function resetAll(reshuffle){
  picks=[];busy=false;reading.hidden=true;reading.innerHTML='';
  if(reshuffle){shuffleDeck();phase=$('#cutToggle').checked?'cut':'pick'}
  renderFan();renderSlots();updateHint();
}
['majorToggle','cutToggle'].forEach(id=>$('#'+id).addEventListener('change',()=>resetAll(true)));
$('#shuffleBtn').addEventListener('click',()=>{
  if(busy)return;
  picks=[];reading.hidden=true;renderSlots();
  if(reduce){resetAll(true);return}
  busy=true;fan.classList.remove('done');
  [...fan.children].forEach(c=>c.classList.remove('taken'));
  fan.classList.add('gather');setHint('洗牌中… <em>— shuffling</em>');revealBtn.hidden=true;resetBtn.hidden=true;
  setTimeout(()=>{shuffleDeck();phase=$('#cutToggle').checked?'cut':'pick';fan.classList.remove('gather');busy=false;updateHint()},700);
});
resetBtn.addEventListener('click',()=>resetAll(true));
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(layoutFan,120)});

renderSpreadPicker();shuffleDeck();phase=$('#cutToggle').checked?'cut':'pick';renderFan();renderSlots();updateHint();renderHist();
})();
</script>
