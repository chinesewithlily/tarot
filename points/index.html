<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>點點星球｜小學生集點 App</title>
<meta name="description" content="點點星球：老師加分、學生集點養寵物、獎品商店兌換的小學生集點 App。">
<meta name="theme-color" content="#FFF8EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="點點星球">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 8C62 8 92 62 88 78C85 90 70 92 50 92C30 92 15 90 12 78C8 62 38 8 50 8Z' fill='%23fff' stroke='%234A3B52' stroke-width='6'/%3E%3Cpath d='M26 70H74V92C64 93 36 93 26 92Z' fill='%234A3B52'/%3E%3Ccircle cx='38' cy='50' r='6' fill='%234A3B52'/%3E%3Ccircle cx='62' cy='50' r='6' fill='%234A3B52'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FFF8EC; --ink:#4A3B52; --soft:#8A7A92;
  --pink:#FF9EB5; --pink2:#FFD6E0; --yellow:#FFD45C; --yellow2:#FFF1C2;
  --mint:#7DDCB8; --mint2:#D6F5E9; --sky:#7EC8F5; --sky2:#DAF0FD;
  --lav:#B9A4F0; --lav2:#ECE5FF; --orange:#FFAE6B;
  --line:3px solid var(--ink); --r:22px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:"Baloo 2","Noto Sans TC",sans-serif; color:var(--ink); font-weight:500;
  background:var(--cream);
  background-image:radial-gradient(#F3E2C6 1.6px,transparent 1.7px);
  background-size:22px 22px; min-height:100vh;
}
button{font-family:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:16px 16px 110px}

/* header */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}
.logo h1{margin:0;font-size:28px;font-weight:900;letter-spacing:1px;line-height:1}
.logo h1 span{color:var(--pink);-webkit-text-stroke:0}
.logo small{display:block;font-size:12px;color:var(--soft);font-weight:700;letter-spacing:2px}
.classpill{margin-left:auto;background:#fff;border:var(--line);border-radius:999px;padding:6px 14px;font-weight:900;box-shadow:3px 3px 0 var(--ink)}
.planbadge{border:var(--line);border-radius:999px;padding:6px 12px;font-weight:900;box-shadow:3px 3px 0 var(--ink);background:var(--yellow)}
.planbadge.free{background:#fff}

/* role tabs */
.roles{display:flex;gap:10px;margin:18px 0 14px;flex-wrap:wrap}
.role{border:var(--line);background:#fff;border-radius:16px;padding:8px 16px;font-weight:900;font-size:16px;box-shadow:3px 3px 0 var(--ink);transition:.12s}
.role:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.role.on{background:var(--pink);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.15)}
.role[data-r=student].on{background:var(--sky)}
.role[data-r=parent].on{background:var(--mint)}

.card{background:#fff;border:var(--line);border-radius:var(--r);box-shadow:5px 5px 0 var(--ink);padding:16px}
.sub{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.chip{border:2.5px solid var(--ink);background:#fff;border-radius:999px;padding:5px 14px;font-weight:800}
.chip.on{background:var(--yellow)}

.row{display:flex;gap:14px;flex-wrap:wrap;align-items:stretch}
.grow{flex:1 1 300px}

/* class goal */
.goal{display:flex;align-items:center;gap:14px}
.jar{width:66px;height:78px;flex:none}
.bar{height:22px;border:var(--line);border-radius:999px;background:var(--yellow2);overflow:hidden}
.bar i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--yellow) 0 10px,#FFC93A 10px 20px);border-right:3px solid var(--ink);transition:width .5s}
.goal b{font-size:18px}
.muted{color:var(--soft);font-size:13px;font-weight:700}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.btn{border:var(--line);border-radius:14px;background:#fff;padding:7px 14px;font-weight:900;box-shadow:3px 3px 0 var(--ink);font-size:15px}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.pink{background:var(--pink);color:#fff}
.btn.yellow{background:var(--yellow)}
.btn.mint{background:var(--mint)}
.btn.sky{background:var(--sky);color:#fff}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:10px;box-shadow:2px 2px 0 var(--ink)}

/* student grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:14px}
.stu{position:relative;background:#fff;border:var(--line);border-radius:20px;box-shadow:4px 4px 0 var(--ink);padding:10px 8px 10px;text-align:center;transition:.12s;user-select:none}
.stu:hover{transform:translateY(-3px) rotate(-1deg)}
.stu.sel{background:var(--yellow2);outline:4px dashed var(--pink);outline-offset:3px}
.stu svg{width:80px;height:80px;display:block;margin:0 auto}
.stu .nm{font-weight:900;font-size:16px;margin-top:2px}
.pts{position:absolute;top:-10px;right:-10px;min-width:38px;height:38px;border-radius:50%;border:var(--line);background:var(--yellow);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;padding:0 4px}
.stu.whole{background:var(--lav2)}
.float{position:fixed;pointer-events:none;font-weight:900;font-size:30px;z-index:99;animation:up 1s ease-out forwards;-webkit-text-stroke:1.5px var(--ink)}
@keyframes up{to{transform:translateY(-70px) scale(1.3);opacity:0}}
.conf{position:fixed;z-index:98;pointer-events:none;font-size:22px;animation:fall 1.2s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),160px) rotate(360deg);opacity:0}}

/* modal */
.mask{position:fixed;inset:0;background:rgba(74,59,82,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.mask.on{display:flex}
.modal{background:var(--cream);border:var(--line);border-radius:26px;box-shadow:6px 6px 0 var(--ink);width:min(520px,100%);max-height:90vh;overflow:auto;padding:18px;animation:pop .22s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.mhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.mhead svg{width:70px;height:70px}
.mhead h2{margin:0;font-size:24px;font-weight:900}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.skill{border:var(--line);border-radius:18px;background:#fff;padding:10px 6px;text-align:center;font-weight:900;box-shadow:3px 3px 0 var(--ink)}
.skill .e{font-size:30px;display:block}
.skill .p{display:inline-block;margin-top:4px;background:var(--mint2);border:2px solid var(--ink);border-radius:999px;padding:0 8px;font-size:13px}
.skill.neg .p{background:var(--pink2)}
.skill:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.sec{font-weight:900;margin:14px 0 8px;font-size:15px}
.x{margin-left:auto;border:var(--line);border-radius:50%;width:38px;height:38px;background:#fff;font-weight:900;font-size:18px;box-shadow:2px 2px 0 var(--ink)}

/* shop */
.prizes{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.prize{background:#fff;border:var(--line);border-radius:20px;box-shadow:4px 4px 0 var(--ink);padding:12px;text-align:center;position:relative}
.prize .e{font-size:44px;line-height:1.1}
.prize .n{font-weight:900;margin:4px 0}
.cost{display:inline-flex;align-items:center;gap:4px;background:var(--yellow2);border:2px solid var(--ink);border-radius:999px;padding:1px 10px;font-weight:900}
.stock{font-size:12px;color:var(--soft);font-weight:800;margin-top:4px}
.prize.out{opacity:.5}
.tag{position:absolute;top:-10px;left:-8px;transform:rotate(-8deg);background:var(--pink);color:#fff;border:2px solid var(--ink);border-radius:8px;padding:0 8px;font-weight:900;font-size:12px}
.form{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.form input,.form select{border:2.5px solid var(--ink);border-radius:12px;padding:7px 10px;font-family:inherit;font-weight:700;font-size:15px;background:#fff;color:var(--ink);min-width:0}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:10px;background:#fff;border:2.5px solid var(--ink);border-radius:16px;padding:8px 12px}
.li svg{width:40px;height:40px;flex:none}
.li .t{flex:1;font-weight:800}
.li .t small{display:block;color:var(--soft);font-weight:700}
.plus{color:#2FA77A;font-weight:900}.minus{color:#E2577A;font-weight:900}
.empty{text-align:center;color:var(--soft);font-weight:800;padding:18px}

/* student view */
.me{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.me .big svg{width:170px;height:170px}
.lv{display:inline-block;background:var(--sky);color:#fff;border:var(--line);border-radius:999px;padding:2px 14px;font-weight:900;box-shadow:2px 2px 0 var(--ink)}
.bigpts{font-size:48px;font-weight:900;line-height:1}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}
.stamp{aspect-ratio:1;border:2.5px dashed #CDBFD4;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;background:#fff}
.stamp.got{border:2.5px solid var(--ink);background:var(--pink2);animation:pop .3s}
.picker{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px}
.picker button{border:2.5px solid var(--ink);border-radius:16px;background:#fff;padding:4px 8px;display:flex;flex-direction:column;align-items:center;font-weight:800;flex:none}
.picker button.on{background:var(--sky2)}
.picker svg{width:44px;height:44px}
.acc{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.accb{border:var(--line);border-radius:16px;background:#fff;padding:8px;text-align:center;font-weight:800;position:relative}
.accb.on{background:var(--yellow2)}
.accb .e{font-size:28px;display:block}
.lock{position:absolute;inset:0;background:rgba(255,248,236,.75);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px}

/* parent / plans */
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.plan{background:#fff;border:var(--line);border-radius:24px;box-shadow:5px 5px 0 var(--ink);padding:18px;position:relative}
.plan h3{margin:0 0 2px;font-size:22px;font-weight:900}
.plan .price{font-size:30px;font-weight:900}
.plan .price small{font-size:14px;color:var(--soft)}
.plan ul{padding-left:0;list-style:none;margin:12px 0}
.plan li{padding:4px 0 4px 26px;position:relative;font-weight:700}
.plan li:before{content:"✓";position:absolute;left:0;top:3px;width:20px;height:20px;border-radius:50%;background:var(--mint);border:2px solid var(--ink);font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:900}
.plan.hot{background:var(--yellow2)}
.plan.hot .tag{background:var(--pink)}
.chart{display:flex;align-items:flex-end;gap:10px;height:150px;padding:10px 4px 0;border-bottom:3px solid var(--ink)}
.chart div{flex:1;background:var(--sky);border:2.5px solid var(--ink);border-bottom:none;border-radius:10px 10px 0 0;position:relative;min-height:6px;transition:height .5s}
.chart div span{position:absolute;top:-22px;left:0;right:0;text-align:center;font-weight:900;font-size:13px}
.days{display:flex;gap:10px;padding:4px}
.days span{flex:1;text-align:center;font-weight:800;font-size:13px;color:var(--soft)}
.note{background:var(--lav2);border:2.5px dashed var(--lav);border-radius:16px;padding:10px 14px;font-weight:700;font-size:14px}

.mascot{position:fixed;right:14px;bottom:14px;z-index:40;display:flex;align-items:flex-end;gap:6px;pointer-events:none}
.bubble{background:#fff;border:var(--line);border-radius:18px 18px 4px 18px;padding:8px 12px;font-weight:800;max-width:220px;box-shadow:3px 3px 0 var(--ink);font-size:14px;animation:pop .3s}
.mascot svg{width:78px;height:78px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
@media (max-width:600px){
  .logo h1{font-size:22px}.grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
  .stu svg{width:64px;height:64px}.mascot svg{width:58px;height:58px}.bubble{max-width:170px;font-size:13px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo">
      <div id="logoMascot"></div>
      <div><h1>點點<span>星球</span></h1><small>POINT PLANET · 小學生集點</small></div>
    </div>
    <div class="classpill" id="classPill">🏫 三年二班</div>
    <div class="planbadge" id="planBadge"></div>
  </div>

  <div class="roles">
    <button class="role on" data-r="teacher">🧑‍🏫 老師</button>
    <button class="role" data-r="student">🎒 學生</button>
    <button class="role" data-r="parent">🏠 家長／訂閱</button>
  </div>

  <div id="view"></div>
  <p class="muted" style="text-align:center;margin-top:28px">© 點點星球 · 資料只存在這台裝置的瀏覽器 · 方案與付款為示範，不會收費</p>
</div>

<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div class="mascot"><div class="bubble" id="bubble">嗨！我是小糰～點一位同學來加分吧！</div><div id="mascotSvg"></div></div>

<script>
/* ---------- 原創角色（程式繪製） ---------- */
const PETS=[
 {name:'喵糰',c:'#FFB8C9'},{name:'兔兔',c:'#C9B8FF'},{name:'熊熊',c:'#FFC98F'},
 {name:'啾啾',c:'#FFE07A'},{name:'呱呱',c:'#9FE3B8'},{name:'小恐',c:'#8FD3F5'}
];
const ACCS=[
 {id:'none',name:'不戴',e:'🚫',plus:false},{id:'bow',name:'蝴蝶結',e:'🎀',plus:false},
 {id:'leaf',name:'小葉子',e:'🌱',plus:false},{id:'crown',name:'皇冠',e:'👑',plus:true},
 {id:'hat',name:'魔法帽',e:'🎩',plus:true},{id:'star',name:'星星髮夾',e:'⭐',plus:true},
 {id:'glass',name:'圓眼鏡',e:'👓',plus:true},{id:'flower',name:'小花',e:'🌸',plus:true}
];
function critter(type,acc='none',mood='happy'){
  const p=PETS[type%PETS.length],c=p.c,k='#4A3B52';
  let ears='';
  if(type===0) ears=`<path d="M22 40 L28 14 L44 32Z M78 40 L72 14 L56 32Z" fill="${c}" stroke="${k}" stroke-width="3.5" stroke-linejoin="round"/>`;
  if(type===1) ears=`<ellipse cx="36" cy="18" rx="8" ry="20" fill="${c}" stroke="${k}" stroke-width="3.5"/><ellipse cx="64" cy="18" rx="8" ry="20" fill="${c}" stroke="${k}" stroke-width="3.5"/><ellipse cx="36" cy="20" rx="3.5" ry="12" fill="#FFD6E0"/><ellipse cx="64" cy="20" rx="3.5" ry="12" fill="#FFD6E0"/>`;
  if(type===2) ears=`<circle cx="26" cy="30" r="11" fill="${c}" stroke="${k}" stroke-width="3.5"/><circle cx="74" cy="30" r="11" fill="${c}" stroke="${k}" stroke-width="3.5"/><circle cx="26" cy="30" r="5" fill="#FFD6E0"/><circle cx="74" cy="30" r="5" fill="#FFD6E0"/>`;
  if(type===3) ears=`<path d="M50 26 C46 14 40 12 42 6 C48 10 50 14 50 26 C52 16 56 10 60 10 C58 16 54 20 50 26Z" fill="${c}" stroke="${k}" stroke-width="3" stroke-linejoin="round"/>`;
  if(type===4) ears=`<circle cx="32" cy="32" r="13" fill="${c}" stroke="${k}" stroke-width="3.5"/><circle cx="68" cy="32" r="13" fill="${c}" stroke="${k}" stroke-width="3.5"/>`;
  if(type===5) ears=`<path d="M34 30 L40 16 L46 28 L52 12 L58 28 L64 16 L68 30Z" fill="#FFD45C" stroke="${k}" stroke-width="3" stroke-linejoin="round"/>`;
  const body=`<path d="M14 64 C14 38 30 26 50 26 C70 26 86 38 86 64 C86 82 72 90 50 90 C28 90 14 82 14 64Z" fill="${c}" stroke="${k}" stroke-width="3.5"/>`;
  let eyes;
  if(type===4) eyes=`<circle cx="32" cy="32" r="4.5" fill="${k}"/><circle cx="68" cy="32" r="4.5" fill="${k}"/><circle cx="33.5" cy="30.5" r="1.5" fill="#fff"/><circle cx="69.5" cy="30.5" r="1.5" fill="#fff"/>`;
  else if(mood==='wink') eyes=`<path d="M32 58 q6 -6 12 0" stroke="${k}" stroke-width="3.5" fill="none" stroke-linecap="round"/><circle cx="62" cy="57" r="4.5" fill="${k}"/>`;
  else eyes=`<circle cx="38" cy="57" r="4.5" fill="${k}"/><circle cx="62" cy="57" r="4.5" fill="${k}"/><circle cx="39.5" cy="55.5" r="1.6" fill="#fff"/><circle cx="63.5" cy="55.5" r="1.6" fill="#fff"/>`;
  const face=`<ellipse cx="28" cy="67" rx="6.5" ry="4" fill="#FF8FAB" opacity=".55"/><ellipse cx="72" cy="67" rx="6.5" ry="4" fill="#FF8FAB" opacity=".55"/>
   ${type===3?`<path d="M45 64 L55 64 L50 70Z" fill="#FFAE6B" stroke="${k}" stroke-width="2.5" stroke-linejoin="round"/>`:`<path d="M44 65 q3 4 6 0 q3 4 6 0" stroke="${k}" stroke-width="3" fill="none" stroke-linecap="round"/>`}`;
  const feet=`<ellipse cx="36" cy="90" rx="9" ry="5" fill="${c}" stroke="${k}" stroke-width="3"/><ellipse cx="64" cy="90" rx="9" ry="5" fill="${c}" stroke="${k}" stroke-width="3"/>`;
  let a='';
  if(acc==='bow') a=`<g transform="translate(66 30) rotate(15)"><path d="M0 0 L-12 -8 L-12 8Z M0 0 L12 -8 L12 8Z" fill="#FF7A9C" stroke="${k}" stroke-width="2.5" stroke-linejoin="round"/><circle r="4" fill="#FF7A9C" stroke="${k}" stroke-width="2.5"/></g>`;
  if(acc==='leaf') a=`<path d="M50 26 L50 14" stroke="${k}" stroke-width="3"/><path d="M50 16 C40 4 30 12 34 14 C40 18 46 16 50 16Z M50 16 C60 4 70 12 66 14 C60 18 54 16 50 16Z" fill="#7DDCB8" stroke="${k}" stroke-width="2.5" stroke-linejoin="round"/>`;
  if(acc==='crown') a=`<path d="M34 28 L32 12 L42 20 L50 8 L58 20 L68 12 L66 28Z" fill="#FFD45C" stroke="${k}" stroke-width="3" stroke-linejoin="round"/><circle cx="50" cy="20" r="2.6" fill="#FF7A9C"/>`;
  if(acc==='hat') a=`<path d="M30 30 L70 30 L60 26 L54 2 L40 22 Z" fill="#B9A4F0" stroke="${k}" stroke-width="3" stroke-linejoin="round"/><path d="M26 30 L74 30" stroke="${k}" stroke-width="4" stroke-linecap="round"/><circle cx="50" cy="18" r="2.5" fill="#FFD45C"/>`;
  if(acc==='star') a=`<path d="M70 26 l3 7 7 1 -5 5 1.5 7 -6.5 -3.5 -6.5 3.5 1.5 -7 -5 -5 7 -1Z" fill="#FFD45C" stroke="${k}" stroke-width="2.5" stroke-linejoin="round"/>`;
  if(acc==='glass') a=`<circle cx="38" cy="57" r="9" fill="none" stroke="${k}" stroke-width="3"/><circle cx="62" cy="57" r="9" fill="none" stroke="${k}" stroke-width="3"/><path d="M47 57 L53 57" stroke="${k}" stroke-width="3"/>`;
  if(acc==='flower') a=`<g transform="translate(32 32)">${[0,72,144,216,288].map(r=>`<ellipse rx="4.5" ry="7" transform="rotate(${r}) translate(0 -6)" fill="#FFB8C9" stroke="${k}" stroke-width="2"/>`).join('')}<circle r="3.5" fill="#FFD45C" stroke="${k}" stroke-width="2"/></g>`;
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">${type===5?ears:''}${feet}${type!==5&&type!==3?ears:''}${body}${type===3?ears:''}${eyes}${face}${a}</svg>`;
}
function mascotSvg(){ // 小糰：原創吉祥物（飯糰造型的星球精靈）
  const k='#4A3B52';
  return `<svg viewBox="0 0 100 100"><path d="M50 8 C62 8 92 62 88 78 C85 90 70 92 50 92 C30 92 15 90 12 78 C8 62 38 8 50 8Z" fill="#fff" stroke="${k}" stroke-width="4" stroke-linejoin="round"/>
  <path d="M26 70 L74 70 L74 92 C64 93 36 93 26 92Z" fill="#4A3B52"/><path d="M44 78 l3 -6 3 6 6 1 -4.5 4 1.5 6 -6 -3 -6 3 1.5 -6 -4.5 -4Z" fill="#FFD45C"/>
  <circle cx="38" cy="50" r="4.5" fill="${k}"/><circle cx="62" cy="50" r="4.5" fill="${k}"/><circle cx="39.5" cy="48.5" r="1.6" fill="#fff"/><circle cx="63.5" cy="48.5" r="1.6" fill="#fff"/>
  <ellipse cx="29" cy="59" rx="6" ry="3.5" fill="#FF8FAB" opacity=".6"/><ellipse cx="71" cy="59" rx="6" ry="3.5" fill="#FF8FAB" opacity=".6"/>

function burst(x,y,txt,good=true){
  const f=document.createElement('div');f.className='float';f.textContent=txt;
  f.style.left=x-20+'px';f.style.top=y-30+'px';f.style.color=good?'#FFD45C':'#FF7A9C';document.body.appendChild(f);setTimeout(()=>f.remove(),1000);
  if(!good)return;
  for(let i=0;i<10;i++){const c=document.createElement('div');c.className='conf';c.textContent=['⭐','✨','💖','🌟','🍬'][i%5];
   c.style.left=x+'px';c.style.top=y+'px';c.style.setProperty('--dx',(Math.random()*160-80)+'px');document.body.appendChild(c);setTimeout(()=>c.remove(),1200);}

function toggleSel(){

}
function openWhole(){openGive(S.students.map(s=>s.id),'全班')}
function openGive(ids,title){

  $('#modal').innerHTML=`<div class="mhead">${one?critter(one.pet,one.acc):mascotSvg()}<div><h2>${one?esc(one.name):title||ids.length+' 位同學'}</h2><div class="muted">${one?'目前 '+one.points+' 點 · '+level(one.total)[0]:'一起加分！'}</div></div><button class="x" onclick="closeM()">✕</button></div>
   <div class="sec">🌟 做得好！</div><div class="skills">${S.skills.map((k,i)=>`<button class="skill" onclick="give([${ids}],'s',${i},event)"><span class="e">${k.e}</span>${k.l}<br><span class="p">+${k.p}</span></button>`).join('')}</div>
   <div class="sec">🌱 需要加油（建議少用，多鼓勵）</div><div class="skills">${S.needs.map((k,i)=>`<button class="skill neg" onclick="give([${ids}],'n',${i},event)"><span class="e">${k.e}</span>${k.l}<br><span class="p">${k.p}</span></button>`).join('')}</div>`;
  $('#mask').classList.add('on');
}
function closeM(){$('#mask').classList.remove('on')}
$('#mask').addEventListener('click',e=>{if(e.target.id==='mask')closeM()});
function give(ids,kind,i,ev){
  const k=(kind==='s'?S.skills:S.needs)[i];
  ids.forEach(id=>{const s=S.students[id];s.points=Math.max(0,s.points+k.p);if(k.p>0)s.total+=k.p;S.log.unshift({sid:id,e:k.e,l:k.l,p:k.p,t:Date.now()})});
  if(k.p>0)S.week[S.week.length-1]+=k.p*ids.length;
  const x=ev.clientX,y=ev.clientY;closeM();selMode=false;sel.clear();render();
  if(ids.length===1){const el=$('#stu'+ids[0]);if(el){const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+20,(k.p>0?'+':'')+k.p,k.p>0)}}
  else burst(x,y,'+'+k.p+' ×'+ids.length,true);
  say(k.p>0?['太棒了！'+k.l+'！','好厲害～繼續保持！','閃閃發光✨'][Math.floor(Math.random()*3)]:'沒關係，下次會更好！');
}
function randomPick(){
  const cards=[...document.querySelectorAll('.stu')];let n=0,idx=0;
  const t=setInterval(()=>{cards.forEach(c=>c.classList.remove('sel'));idx=Math.floor(Math.random()*cards.length);cards[idx].classList.add('sel');
   if(++n>14){clearInterval(t);const s=S.students[idx];say('就是你！'+s.name+'！');setTimeout(()=>openGive([s.id]),500)}},90);
}
function approve(rid,ev){
  const r=S.requests.find(x=>x.id===rid),p=S.prizes.find(x=>x.id===r.pid);
  if(p&&p.s<=0){say('這個獎品沒庫存了，先補貨喔！');return}
  r.st='done';if(p)p.s--;burst(ev.clientX,ev.clientY,'🎁',true);say('發獎囉！'+S.students[r.sid].name+'一定很開心！');render();
}
function reject(rid){const r=S.requests.find(x=>x.id===rid),p=S.prizes.find(x=>x.id===r.pid);r.st='no';if(p)S.students[r.sid].points+=p.c;say('已退回，點數還給同學了');render()}
function stock(id,d){const p=S.prizes.find(x=>x.id===id);p.s=Math.max(0,p.s+d);render()}
function delPrize(id){S.prizes=S.prizes.filter(x=>x.id!==id);render()}
function addPrize(){
  const n=$('#pn').value.trim(),c=+$('#pc').value,s=+$('#ps').value;

}

     <div class="plan hot"><div class="tag">最受歡迎</div><h3>⭐ 家長 Plus</h3><div class="price">NT$99 <small>/月</small></div><div class="muted">或 NT$790/年（約 67 折）· 7 天免費試用</div><ul><li>每週學習報告＋老師評語</li><li>在家任務：家長也能加點</li><li>Plus 寵物配件（每月新上架）</li><li>過去紀錄永久保存</li><li>同家庭最多 3 個孩子</li></ul>
       <button class="btn ${S.plan==='free'?'pink':''}" style="width:100%" onclick="togglePlan(event)">${S.plan==='free'?'開始 7 天免費試用（示範）':'取消 Plus（示範）'}</button></div>
     <div class="plan"><h3>🏫 學校方案</h3><div class="price">洽談 <small>/年</small></div><ul><li>全校家長都有 Plus</li><li>校長／主任後台</li><li>跨班排行與全校活動</li><li>補習班、安親班適用</li></ul><div class="muted">依學生人數報價</div></div></div>
     <p class="note" style="margin-top:16px">⚠️ 原型示範：按鈕不會真的收費。價格是我暫訂的參考值，不是市場調查結果。</p>`;
  }
  if(sub.parent==='report'){
    if(S.plan==='free') return h+lockCard('每週學習報告');
    const max=Math.max(...S.week),days=['一','二','三','四','五'];
    const tally={};S.log.filter(l=>l.sid===s.id&&l.p>0).forEach(l=>tally[l.l]=(tally[l.l]||0)+l.p);
    const top=Object.entries(tally).sort((a,b)=>b[1]-a[1]).slice(0,3);
    h+=`<div class="row"><div class="card grow"><div class="sec" style="margin-top:0">📈 本週全班加分（${S.className}）</div><div class="chart">${S.week.map(v=>`<div style="height:${v/max*100}%"><span>${v}</span></div>`).join('')}</div><div class="days">${days.map(d=>`<span>週${d}</span>`).join('')}</div></div>
     <div class="card grow"><div class="mhead">${critter(s.pet,s.acc)}<div><h2>${esc(s.name)}</h2><div class="muted">${level(s.total)[0]} · 累積 ${s.total} 點</div></div></div><div class="sec">本週最常被稱讚</div>${top.length?top.map(([k,v])=>`<div class="li" style="margin-bottom:6px"><div class="t">${esc(k)}</div><span class="plus">+${v}</span></div>`).join(''):'<div class="muted">本週還沒有紀錄——到老師頁幫他加分試試看！</div>'}</div></div>`;
  }
  if(sub.parent==='home'){
    if(S.plan==='free') return h+lockCard('在家任務');
    const tasks=[['🛏️','自己整理床鋪',1],['🍽️','幫忙擺碗筷',1],['📖','閱讀 20 分鐘',2],['🦷','睡前刷牙',1]];
    h+=`<div class="card"><div class="sec" style="margin-top:0">今天 ${esc(s.name)} 完成了什麼？</div><div class="skills">${tasks.map(t=>`<button class="skill" onclick="homePt(${s.id},'${t[0]}','${t[1]}',${t[2]},event)"><span class="e">${t[0]}</span>${t[1]}<br><span class="p">+${t[2]}</span></button>`).join('')}</div>
     <p class="note" style="margin-top:12px">在家的點數會標示「🏠 家裡」，老師看得到來源；每天上限 5 點，避免灌點。</p></div>`;
  }
  return h;
}
function lockCard(name){return `<div class="card" style="text-align:center;padding:30px"><div style="font-size:50px">🔒</div><h2 style="margin:6px 0">${name}是 Plus 功能</h2><p class="muted">開始免費試用就能看到（示範，不會收費）</p><button class="btn pink" onclick="togglePlan(event)">開始 7 天免費試用</button></div>`}
function togglePlan(ev){S.plan=S.plan==='free'?'plus':'free';if(S.plan==='plus'){burst(ev.clientX,ev.clientY,'⭐ Plus!',true);say('Plus 開啟！去「打扮」看看新配件～')}else say('已切回免費版');render()}
function homePt(sid,e,l,p,ev){const s=S.students[sid];s.points+=p;s.total+=p;S.log.unshift({sid,e:'🏠'+e,l,p,t:Date.now()});burst(ev.clientX,ev.clientY,'+'+p,true);say('在家也好棒！');save()}

/* ---------- 啟動 ---------- */
document.querySelectorAll('.role').forEach(b=>b.onclick=()=>{S.role=b.dataset.r;selMode=false;sel.clear();render();
  say({teacher:'點一位同學來加分吧！',student:'看看你的寵物長多大了～',parent:'爸媽可以在這裡看報告喔！'}[S.role])});
$('#mascotSvg').innerHTML=mascotSvg();
$('#logoMascot').innerHTML=mascotSvg().replace('<svg','<svg width="52" height="52"');
render();
</script>
</body>
</html>
